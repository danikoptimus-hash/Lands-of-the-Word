# Тестовый стенд (test.<домен>) на том же сервере: своя база и своё приложение, без Caddy.
# Caddy продакшена проксирует test.<домен> на контейнер lotw-app-test по общей сети (PROD_NET — сеть прод-стека).
# Запуск: deploy/deploy-test.sh (из GitHub Actions по пушу в ветку staging). Переменные — deploy/.env.test.
# ВАЖНО: имена сервисов не должны совпадать с прод-стеком (app, db): сервис получает своё имя как DNS-псевдоним
# в общей сети, и прод начал бы попадать в контейнеры стенда (случилось 23.09). Поэтому app-test / db-test.
services:
  db-test:
    image: postgres:16-alpine
    container_name: lotw-db-test
    restart: unless-stopped
    # Стенд живёт на одном сервере с игрой (ревизия скорости, этап 2). Когда процессора не хватает, игре достаётся вчетверо
    # больше (вес 256 против обычных 1024); пока игра простаивает, стенд работает в полную силу — нагрузочный прогон и
    # выкладка стенда больше не отнимают процессор у игроков. Память стенда ограничена: при её нехватке перезапустится он, а не игра.
    cpu_shares: 256
    mem_limit: 384m
    environment:
      POSTGRES_USER: lotw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lotw
    volumes:
      - db_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotw -d lotw"]
      interval: 5s
      timeout: 3s
      retries: 20

  app-test:
    image: ghcr.io/danikoptimus-hash/lotw-app:${APP_TAG:-test}
    container_name: lotw-app-test
    restart: unless-stopped
    cpu_shares: 256
    mem_limit: 512m
    # Журнал контейнера ограничен по размеру (ревизия 15.11): раньше он рос без предела, пока контейнер не пересоздан.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # connection_limit=20: по умолчанию Prisma держит 2×ядра+1 соединения (три на одном ядре), и запросы вставали в очередь к базе (прогон 24.10).
      DATABASE_URL: postgresql://lotw:${POSTGRES_PASSWORD}@lotw-db-test:5432/lotw?schema=public&connection_limit=20
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: "3000"
      WEB_DIST: /app/apps/web/dist
      PUBLIC_URL: https://test.${DOMAIN}
      # Почта и вход через Google на стенде выключены: письма реальным людям с теста не уходят.
      SMTP_HOST: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
    expose:
      - "3000"

networks:
  default:
    name: ${PROD_NET:-deploy_default}
    external: true

volumes:
  db_test_data:
