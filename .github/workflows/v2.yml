# Версия 2 (клиент с объёмным миром, папка v2/): проверка, автоматические кадры и сборка для Windows.
# Запускается при изменениях в v2/ на рабочей ветке. Сайт, стенд и прод этот конвейер не трогает.
# Результат — ветка v2-out (кадры, журналы, сборка; каждый раз заново, без истории) и артефакт запуска.
# Канал «тест» — ветка v2-test (описание latest.json и архив): из неё программа обновляет себя сама.
# В канал сборка попадает, только когда все проверки прошли и номер версии в v2/project.godot новый:
# промежуточные правки с тем же номером до тестировщика не доходят.
name: v2

on:
  push:
    branches: [map-e1]
    paths:
      - "v2/**"
      - ".github/workflows/v2.yml"
  workflow_dispatch:
    inputs:
      views:
        description: "Коды мест для дополнительных кадров через пробел (x,z,расстояние,поворот,наклон)"
        default: ""

permissions:
  contents: write

concurrency:
  group: v2
  cancel-in-progress: true

env:
  # Версия движка закреплена; контрольные суммы — из SHA512-SUMS.txt выпуска.
  GODOT_VERSION: "4.6.2"
  GODOT_SHA512: "b6e4d5a716085e9649905be2afe77f723f97853544fb33392ce3d32594c730a95d9eb4d1042ed51508904c9e1d996bd36b7c7a2bf4f93f5b1885e98d81b792e7"
  TEMPLATES_SHA512: "ce6a91e8d86df3183452c5e40d75fa0faf94268257b1d3dc1e4538caa277ca7c0fd3d113f8104a5515c3af84d49c5cefc77d7d1e7847ba422413d5466feb49fd"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Движок из кэша
        id: engine
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-windows-v1

      - name: Скачать движок и шаблон сборки для Windows
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot/dl ~/godot/templates
          cd ~/godot/dl
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 -o editor.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${GODOT_SHA512}  editor.zip" | sha512sum -c -
          echo "${TEMPLATES_SHA512}  templates.tpz" | sha512sum -c -
          unzip -q editor.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot
          unzip -q -j templates.tpz "templates/windows_release_x86_64.exe" "templates/version.txt" -d ~/godot/templates
          rm -rf ~/godot/dl

      - name: Установить движок
        run: |
          set -euo pipefail
          chmod +x ~/godot/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp ~/godot/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Экран и программная видеокарта
        run: |
          set -euo pipefail
          packages="xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libfontconfig1 zip"
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          # Зеркало пакетов Azure у машин GitHub иногда не находится по имени (11.11 — два запуска подряд упали
          # ещё до проверок): тогда повтор через основные зеркала Ubuntu.
          installed=0
          for attempt in 1 2 3; do
            if sudo apt-get $apt_options update -qq && sudo apt-get $apt_options install -y -qq $packages > /dev/null; then
              installed=1
              break
            fi
            echo "Пакеты не скачались (попытка $attempt) — повторяю через основные зеркала Ubuntu" >&2
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            sleep $((attempt * 15))
          done
          [ "$installed" -eq 1 ]
          vulkaninfo --summary 2>/dev/null | grep -E "deviceName|driverName" || true

      - name: Номер сборки
        run: |
          set -euo pipefail
          mkdir -p out/log out/shots out/build
          commit="$(git rev-parse --short HEAD)"
          stamp="${commit} от $(date -u +%d.%m.%Y)"
          sed -i "s/^const BUILD := \".*\"/const BUILD := \"${stamp}\"/" v2/src/core/build_info.gd
          sed -i "s/^const COMMIT := \"[^\"]*\"/const COMMIT := \"${commit}\"/" v2/src/core/build_info.gd
          grep -nE "const (BUILD|COMMIT)" v2/src/core/build_info.gd
          echo "$stamp" > out/build/sborka.txt
          echo "BUILD_COMMIT=${commit}" >> "$GITHUB_ENV"
          echo "BUILD_STAMP=${stamp}" >> "$GITHUB_ENV"

      - name: Импорт проекта и проверка скриптов
        run: |
          set -uo pipefail
          godot --headless --path v2 --import 2>&1 | tee out/log/import.log
          : > out/log/check.log
          for file in $(cd v2 && find src -name "*.gd" | sort); do
            echo "== $file" >> out/log/check.log
            godot --headless --path v2 --check-only --script "res://$file" >> out/log/check.log 2>&1 || true
          done
          if grep -nE "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" out/log/import.log out/log/check.log; then
            echo "::error::Ошибки в скриптах, см. журнал"
            exit 1
          fi

      - name: Кадры облёта и проверки камеры
        env:
          VIEWS: ${{ inputs.views }}
        run: |
          set -uo pipefail
          extra=""
          for code in ${VIEWS:-}; do extra="$extra --view=$code"; done
          xvfb-run -a -s "-screen 0 1600x900x24" timeout 1500 \
            godot --path v2 --rendering-driver vulkan --audio-driver Dummy --resolution 1600x900 -- "--shots=$PWD/out/shots" $extra 2>&1 | tee out/log/shots.log
          code=${PIPESTATUS[0]}
          grep -nE "ПРОВЕРКА|ИТОГ|МИР|СБОЙ" out/log/shots.log || true
          if grep -nE "SCRIPT ERROR|SHADER ERROR|Shader compilation failed|Parse Error" out/log/shots.log; then
            echo "::error::Ошибки скриптов или шейдеров при запуске"
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::Запуск завершился с кодом $code"
            exit 1
          fi
          ls -la out/shots

      - name: Сборка для Windows
        run: |
          set -euo pipefail
          mkdir -p out/build/win
          godot --headless --path v2 --export-release "Windows Desktop" "$PWD/out/build/win/ZemliSlova-v2-test.exe" 2>&1 | tee out/log/export.log
          test -s out/build/win/ZemliSlova-v2-test.exe
          cp v2/tools/KAK-ZAPUSTIT.txt out/build/win/
          (cd out/build/win && zip -q -9 ../ZemliSlova-v2-test-win64.zip ./*)
          # Описание сборки для самообновления: версия, номер, контрольные суммы архива и программы.
          python3 - <<'PY'
          import hashlib, json, os, re

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as file:
                  for block in iter(lambda: file.read(1 << 20), b""):
                      digest.update(block)
              return digest.hexdigest()

          version = re.search(r'config/version="([^"]+)"', open("v2/project.godot", encoding="utf-8").read()).group(1)
          archive = "out/build/ZemliSlova-v2-test-win64.zip"
          program = "out/build/win/ZemliSlova-v2-test.exe"
          manifest = {
              "format": 1,
              "version": version,
              "commit": os.environ["BUILD_COMMIT"],
              "build": os.environ["BUILD_STAMP"],
              "file": os.path.basename(archive),
              "size": os.path.getsize(archive),
              "sha256": sha256(archive),
              "exe": os.path.basename(program),
              "exe_sha256": sha256(program),
              "notes": open("v2/data/chto_novogo.txt", encoding="utf-8").read().strip(),
          }
          with open("out/build/latest.json", "w", encoding="utf-8") as file:
              json.dump(manifest, file, ensure_ascii=False, indent=2)
          print(json.dumps({key: manifest[key] for key in ("version", "commit", "size")}, ensure_ascii=False))
          PY
          rm -rf out/build/win
          ls -la out/build

      - name: Проверка самообновления
        run: |
          set -uo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory out/build > out/log/http.log 2>&1 &
          server=$!
          sleep 1
          timeout 300 godot --headless --path v2 -- "--update-test=http://127.0.0.1:8765/" "--update-target=$PWD/out/updtest/ZemliSlova-v2-test.exe" 2>&1 | tee out/log/update.log
          code=${PIPESTATUS[0]}
          kill "$server" || true
          rm -rf out/updtest
          if grep -nE "SCRIPT ERROR|Parse Error|НЕ ПРОЙДЕНА" out/log/update.log; then
            echo "::error::Самообновление не прошло проверку"
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::Проверка самообновления завершилась с кодом $code"
            exit 1
          fi

      - name: Канал «тест» — публикация при новой версии
        run: |
          set -uo pipefail
          version=$(python3 -c "import json; print(json.load(open('out/build/latest.json', encoding='utf-8'))['version'])")
          published="нет"
          if git fetch -q --depth 1 origin v2-test 2>/dev/null; then
            published=$(git show FETCH_HEAD:latest.json 2>/dev/null | python3 -c "import json, sys; print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "нет")
          fi
          echo "В канале: ${published}; собрано: ${version}"
          echo "$published -> $version" > out/build/kanal.txt
          if [ "$published" = "$version" ]; then
            echo "Версия та же — канал «тест» не меняется."
            exit 0
          fi
          set -e
          mkdir channel
          cp out/build/latest.json out/build/ZemliSlova-v2-test-win64.zip channel/
          cd channel
          git init -q
          git checkout -q -b v2-test
          git add -A
          git -c user.name="v2-workflow" -c user.email="v2-workflow@users.noreply.github.com" commit -qm "Канал «тест»: версия ${version}, сборка ${BUILD_STAMP}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" v2-test
          echo "Опубликована версия ${version}."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-out
          path: out
          retention-days: 14

      - name: Ветка v2-out с результатом
        if: always()
        run: |
          set -euo pipefail
          cd out
          git init -q
          git checkout -q -b v2-out
          git add -A
          git -c user.name="v2-workflow" -c user.email="v2-workflow@users.noreply.github.com" commit -qm "Версия 2: кадры и сборка, запуск ${{ github.run_id }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" v2-out
