# Озвучка ролика для онбординга голосом владельца через ElevenLabs (кнопка Run workflow).
# Ключ — только в секрете ELEVENLABS_API_KEY. Запись голоса кладут в репозиторий (путь — поле sample),
# либо указывают voice_id уже созданного голоса. Из видео звук вырезается сам (sample_range — нужные отрезки).
# Результат: артефакт voice-tts и ветка voice-tts (out/tts, out/sfx, out/music, out/sample).
name: voice

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Путь к записи голоса в репозитории (через запятую, если файлов несколько)"
        default: "voice-sample.m4a"
      voice_id:
        description: "voice_id уже созданного голоса (тогда запись не нужна)"
        default: ""
      model_id:
        description: "Модель ElevenLabs"
        default: "eleven_multilingual_v2"
      keep_accents:
        description: "Ударения в тексте: 1 — с пометками, 0 — без, both — оба варианта"
        default: "both"
      sample_range:
        description: "Отрезки записи мм:сс-мм:сс через запятую (пусто — весь файл)"
        default: ""
      isolate:
        description: "Почистить запись от шума и музыки перед клонированием (1/0)"
        default: "1"
      sfx:
        description: "Сгенерировать звуковые эффекты (1/0)"
        default: "1"
      music:
        description: "Сгенерировать музыку (1/0)"
        default: "1"
      stages:
        description: "Этапы через запятую: voice,tts,sfx,music (например, только music,sfx)"
        default: "voice,tts,sfx,music"

permissions:
  contents: write

concurrency:
  group: voice
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg для вырезки отрезков записи
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && ffmpeg -version | head -1
      - name: Озвучка
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SAMPLE: ${{ inputs.sample }}
          VOICE_ID: ${{ inputs.voice_id }}
          MODEL_ID: ${{ inputs.model_id }}
          KEEP_ACCENTS: ${{ inputs.keep_accents }}
          SFX: ${{ inputs.sfx }}
          SAMPLE_RANGE: ${{ inputs.sample_range }}
          ISOLATE: ${{ inputs.isolate }}
          MUSIC: ${{ inputs.music }}
          STAGES: ${{ inputs.stages }}
          OUT: out
        run: python3 scripts/voice/elevenlabs_tts.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice-tts
          path: out
      - name: Ветка voice-tts с результатом
        run: |
          cd out
          git init -q
          git checkout -q -b voice-tts
          git add -A
          git -c user.name="voice-workflow" -c user.email="voice-workflow@users.noreply.github.com" commit -qm "Озвучка ролика, запуск ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" voice-tts
