name: deploy

on:
  push:
    branches: [claude/lands-word-city-conquest-6xtei9]
    paths-ignore:
      - "docs/**"
      - "assets/raw/**"
      - "assets/reference/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lotw
          POSTGRES_PASSWORD: lotw
          POSTGRES_DB: lotw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lotw -d lotw"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://lotw:lotw@localhost:5432/lotw?schema=public
      SESSION_SECRET: ci-secret-please
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/domain
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/web

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Есть ли уже приложение (Dockerfile)?
        run: |
          if [ -f Dockerfile ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"; else echo "has_app=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.check.outputs.has_app == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.check.outputs.has_app == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.check.outputs.has_app == 'true'
        name: Сборка и публикация образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/danikoptimus-hash/lotw-app:latest
            ghcr.io/danikoptimus-hash/lotw-app:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Обновление сервера по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,HAS_APP
          script: bash /opt/lotw/deploy/deploy.sh
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_APP: ${{ needs.build.outputs.has_app }}
