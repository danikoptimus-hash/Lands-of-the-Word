name: deploy

on:
  push:
    branches: [claude/lands-word-city-conquest-6xtei9]
    paths-ignore:
      - "docs/**"
      - "assets/raw/**"
      - "assets/reference/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Есть ли уже приложение (Dockerfile)?
        run: |
          if [ -f Dockerfile ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"; else echo "has_app=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.check.outputs.has_app == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.check.outputs.has_app == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.check.outputs.has_app == 'true'
        name: Сборка и публикация образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/danikoptimus-hash/lotw-app:latest
            ghcr.io/danikoptimus-hash/lotw-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Обновление сервера по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,HAS_APP
          script: bash /opt/lotw/deploy/deploy.sh
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_APP: ${{ needs.build.outputs.has_app }}
