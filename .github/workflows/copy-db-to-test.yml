# Копия боевой базы на тестовый стенд (кнопка Run workflow). Прод только читается; на стенде база пересоздаётся.
name: copy-db-to-test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Копирование базы по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            bash "$HOME/lotw-test/deploy/copy-db-to-test.sh"
