# Тестовый стенд test.<домен>: каждый пуш в ветку staging — тесты, образ :test, выкладка на стенд.
# Прод (ветка main, deploy.yml) не трогается: в прод изменения попадают только после проверки владельцем на стенде.
name: deploy-test

on:
  push:
    branches: [staging]
    paths-ignore:
      - "docs/**"
      - "assets/raw/**"
      - "assets/reference/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lotw
          POSTGRES_PASSWORD: lotw
          POSTGRES_DB: lotw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lotw -d lotw"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://lotw:lotw@localhost:5432/lotw?schema=public
      SESSION_SECRET: ci-secret-please
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/domain
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/web

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Сборка и публикация образа :test
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/danikoptimus-hash/lotw-app:test
            ghcr.io/danikoptimus-hash/lotw-app:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Обновление стенда по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            if [ ! -d /opt/lotw-test/.git ]; then git clone --quiet --branch staging "$(git -C /opt/lotw remote get-url origin)" /opt/lotw-test; fi
            cd /opt/lotw-test
            git fetch --quiet origin staging
            git reset --hard --quiet origin/staging
            bash deploy/deploy-test.sh
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
