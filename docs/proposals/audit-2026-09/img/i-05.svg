<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">
  <rect width="720" height="640" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b645a"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b2a1a">Состояния стороны и города для одной команды</text>

  <!-- edge task states -->
  <text x="16" y="66" fill="#3b2a1a" font-weight="bold">Сторона с делом (TeamEdgeTask)</text>
  <rect x="16" y="84" width="110" height="44" rx="22" fill="#ffffff" stroke="#6b645a" stroke-width="2"/>
  <text x="71" y="111" text-anchor="middle" fill="#3b2a1a">OPEN</text>
  <line x1="126" y1="106" x2="176" y2="106" stroke="#6b645a" stroke-width="2" marker-end="url(#a)"/>
  <text x="151" y="98" text-anchor="middle" fill="#6b645a">взять</text>
  <rect x="180" y="84" width="110" height="44" rx="22" fill="#ffffff" stroke="#c7742a" stroke-width="2"/>
  <text x="235" y="111" text-anchor="middle" fill="#3b2a1a">TAKEN</text>
  <line x1="290" y1="106" x2="340" y2="106" stroke="#6b645a" stroke-width="2" marker-end="url(#a)"/>
  <text x="315" y="98" text-anchor="middle" fill="#6b645a">сдать</text>
  <rect x="344" y="84" width="130" height="44" rx="22" fill="#ffffff" stroke="#c7742a" stroke-width="2"/>
  <text x="409" y="111" text-anchor="middle" fill="#3b2a1a">SUBMITTED</text>
  <line x1="474" y1="98" x2="540" y2="98" stroke="#4c7a3f" stroke-width="2" marker-end="url(#a)"/>
  <text x="507" y="88" text-anchor="middle" fill="#4c7a3f">одобрить</text>
  <rect x="544" y="72" width="140" height="44" rx="22" fill="#f3f7f1" stroke="#4c7a3f" stroke-width="2"/>
  <text x="614" y="99" text-anchor="middle" fill="#3b2a1a">APPROVED</text>
  <text x="614" y="138" text-anchor="middle" fill="#6b645a">перекрёсток открыт</text>
  <line x1="474" y1="116" x2="540" y2="160" stroke="#c7742a" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="152" text-anchor="end" fill="#c7742a">вернуть</text>
  <rect x="544" y="156" width="140" height="44" rx="22" fill="#fff7f0" stroke="#c7742a" stroke-width="2"/>
  <text x="614" y="183" text-anchor="middle" fill="#3b2a1a">REJECTED</text>
  <path d="M544,178 L409,178 L409,132" stroke="#6b645a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="409" y="200" text-anchor="middle" fill="#6b645a">сдать заново (или взять заново)</text>
  <path d="M235,128 L235,164 L200,164" stroke="#6b645a" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <text x="16" y="200" fill="#6b645a">отпустить → OPEN</text>

  <text x="16" y="236" fill="#6b645a">Отпускает и сдаёт: взявший, капитан, летописец. Для типов «фото» и «видео»</text>
  <text x="16" y="258" fill="#6b645a">нужна ссылка; для «отчёт» и «подтверждение» — ссылка или текст от 5 знаков.</text>
  <text x="16" y="280" fill="#6b645a">Пожертвование вместо любого дела: сумма ≥ минимума настроек, ссылка на чек.</text>
  <text x="16" y="302" fill="#6b645a">Тайное дело: ссылки и текст сдачи видит только взявший и админ в проверке.</text>

  <!-- city states -->
  <text x="16" y="346" fill="#3b2a1a" font-weight="bold">Город (TeamCityState)</text>
  <rect x="16" y="364" width="130" height="52" rx="8" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="81" y="385" text-anchor="middle" fill="#3b2a1a">достигнут</text>
  <text x="81" y="406" text-anchor="middle" fill="#6b645a" font-size="13">виден владелец</text>
  <line x1="146" y1="390" x2="170" y2="390" stroke="#6b645a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="174" y="364" width="140" height="52" rx="8" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="244" y="385" text-anchor="middle" fill="#3b2a1a">порядок собран</text>
  <text x="244" y="406" text-anchor="middle" fill="#6b645a" font-size="13">orderSolved</text>
  <line x1="314" y1="390" x2="338" y2="390" stroke="#6b645a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="342" y="364" width="140" height="52" rx="8" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="412" y="385" text-anchor="middle" fill="#3b2a1a">все задания</text>
  <text x="412" y="406" text-anchor="middle" fill="#6b645a" font-size="13">doneTasks = все</text>
  <line x1="482" y1="390" x2="536" y2="390" stroke="#4c7a3f" stroke-width="2" marker-end="url(#a)"/>
  <text x="509" y="380" text-anchor="middle" fill="#4c7a3f" font-size="13">ключ</text>
  <rect x="540" y="364" width="164" height="52" rx="8" fill="#f3f7f1" stroke="#4c7a3f" stroke-width="2"/>
  <text x="622" y="385" text-anchor="middle" fill="#3b2a1a">взят</text>
  <text x="622" y="406" text-anchor="middle" fill="#6b645a" font-size="13">1-й город = столица</text>

  <line x1="412" y1="416" x2="412" y2="452" stroke="#c7742a" stroke-width="2" marker-end="url(#a)"/>
  <text x="424" y="440" fill="#c7742a" font-size="13">занят</text>
  <rect x="342" y="456" width="140" height="52" rx="8" fill="#fff7f0" stroke="#c7742a" stroke-width="2"/>
  <text x="412" y="477" text-anchor="middle" fill="#3b2a1a">вызов</text>
  <text x="412" y="498" text-anchor="middle" fill="#6b645a" font-size="13">QUEUED / ATTACK</text>
  <line x1="482" y1="470" x2="540" y2="420" stroke="#4c7a3f" stroke-width="2" marker-end="url(#a)"/>
  <text x="520" y="462" text-anchor="middle" fill="#4c7a3f" font-size="13">WON</text>

  <line x1="622" y1="416" x2="622" y2="452" stroke="#c7742a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="540" y="456" width="164" height="52" rx="8" fill="#ffffff" stroke="#6b645a" stroke-width="2"/>
  <text x="622" y="477" text-anchor="middle" fill="#3b2a1a">потерян / руины</text>
  <text x="622" y="498" text-anchor="middle" fill="#6b645a" font-size="13">capturedAt = null</text>
  <path d="M704,482 L714,482 L714,390 L706,390" stroke="#4c7a3f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <text x="16" y="548" fill="#6b645a">Решённые задания и порядок у команды сохраняются навсегда: потерянный город</text>
  <text x="16" y="570" fill="#6b645a">она возвращает испытанием, руины занимает кнопкой без ключа и без испытания.</text>
  <text x="16" y="592" fill="#6b645a">Ключ конверта и знаки шифра одни на город для всех команд; попытки, паузы</text>
  <text x="16" y="614" fill="#6b645a">и суточные блокировки — свои у каждой команды.</text>
</svg>
