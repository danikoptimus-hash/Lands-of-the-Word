<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">
  <rect width="720" height="560" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b2a1a">Недельный ритм команды «Моряки» (неделя без испытания)</text>

  <g font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="136" y="48" width="80" height="30" fill="#3b2a1a"/><text x="176" y="69">Пн</text>
    <rect x="218" y="48" width="80" height="30" fill="#3b2a1a"/><text x="258" y="69">Вт</text>
    <rect x="300" y="48" width="80" height="30" fill="#3b2a1a"/><text x="340" y="69">Ср</text>
    <rect x="382" y="48" width="80" height="30" fill="#3b2a1a"/><text x="422" y="69">Чт</text>
    <rect x="464" y="48" width="80" height="30" fill="#3b2a1a"/><text x="504" y="69">Пт</text>
    <rect x="546" y="48" width="80" height="30" fill="#3b2a1a"/><text x="586" y="69">Сб</text>
    <rect x="628" y="48" width="80" height="30" fill="#c7742a"/><text x="668" y="69">Вс</text>
  </g>

  <g fill="#3b2a1a" font-weight="bold">
    <text x="16" y="113">Капитан</text>
    <text x="16" y="173">Участники</text>
    <text x="16" y="233">Летописец</text>
    <text x="16" y="293">Разведчик</text>
    <text x="16" y="353">Пророк</text>
    <text x="16" y="413">Админ</text>
    <text x="16" y="473">Сервер</text>
  </g>
  <g stroke="#6b645a" stroke-width="0.6" stroke-dasharray="3,3">
    <line x1="136" y1="78" x2="136" y2="500"/><line x1="218" y1="78" x2="218" y2="500"/><line x1="300" y1="78" x2="300" y2="500"/>
    <line x1="382" y1="78" x2="382" y2="500"/><line x1="464" y1="78" x2="464" y2="500"/><line x1="546" y1="78" x2="546" y2="500"/>
    <line x1="628" y1="78" x2="628" y2="500"/><line x1="708" y1="78" x2="708" y2="500"/>
  </g>

  <!-- captain -->
  <rect x="140" y="92" width="318" height="32" rx="6" fill="#fff7f0" stroke="#c7742a"/>
  <text x="299" y="113" text-anchor="middle" fill="#3b2a1a">распределяет стороны, роли и стихи</text>
  <rect x="632" y="92" width="72" height="32" rx="6" fill="#fff7f0" stroke="#c7742a"/>
  <text x="668" y="113" text-anchor="middle" fill="#3b2a1a">план</text>

  <!-- members -->
  <rect x="140" y="152" width="400" height="32" rx="6" fill="#ffffff" stroke="#2e627e"/>
  <text x="340" y="173" text-anchor="middle" fill="#3b2a1a">3–4 дела параллельно: взять → сделать → сдать</text>
  <rect x="550" y="152" width="154" height="32" rx="6" fill="#ffffff" stroke="#2e627e"/>
  <text x="627" y="173" text-anchor="middle" fill="#3b2a1a">задания города</text>

  <!-- chronicler -->
  <rect x="386" y="212" width="318" height="32" rx="6" fill="#ffffff" stroke="#6b645a"/>
  <text x="545" y="233" text-anchor="middle" fill="#3b2a1a">сдаёт и отпускает чужие дела</text>

  <!-- scout -->
  <rect x="140" y="272" width="80" height="32" rx="6" fill="#f3f7f1" stroke="#4c7a3f"/>
  <text x="180" y="293" text-anchor="middle" fill="#3b2a1a">1 взгляд</text>
  <text x="232" y="293" fill="#6b645a">город или развилка; следующий — через 7 суток</text>

  <!-- prophet -->
  <rect x="140" y="332" width="110" height="32" rx="6" fill="#f3f7f1" stroke="#4c7a3f"/>
  <text x="195" y="353" text-anchor="middle" fill="#3b2a1a">1 подсказка</text>
  <text x="262" y="353" fill="#6b645a">текст района до 60 стихов; раз в 7 суток</text>

  <!-- admin -->
  <rect x="140" y="392" width="564" height="32" rx="6" fill="#eef4f7" stroke="#2e627e"/>
  <text x="422" y="413" text-anchor="middle" fill="#3b2a1a">письмо на каждую сдачу → одобрить / вернуть с комментарием</text>

  <!-- server -->
  <rect x="140" y="452" width="564" height="32" rx="6" fill="#ffffff" stroke="#6b645a"/>
  <text x="422" y="473" text-anchor="middle" fill="#3b2a1a">каждую минуту: вызовы 14 д, ответы T, проходы 3 д, срок игры</text>

  <text x="16" y="522" fill="#6b645a">Лимиты разведчика и пророка — 7 суток от последнего использования,</text>
  <text x="16" y="544" fill="#6b645a">на команду (Team.lastPeekAt / lastHintAt), не по календарной неделе.</text>
</svg>
