<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="720" height="560" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#3b2a1a">Схема сущностей «как есть» (упрощённо): база, код, память</text>

  <!-- Организация и игра -->
  <rect x="20" y="50" width="120" height="40" rx="6" fill="#ffffff" stroke="#3b2a1a" stroke-width="1.5"/>
  <text x="80" y="75" text-anchor="middle" fill="#3b2a1a">Organization</text>
  <line x1="140" y1="70" x2="180" y2="70" stroke="#6b645a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="180" y="44" width="200" height="52" rx="6" fill="#ffffff" stroke="#3b2a1a" stroke-width="1.5"/>
  <text x="280" y="64" text-anchor="middle" font-weight="bold" fill="#3b2a1a">Game</text>
  <text x="280" y="84" text-anchor="middle" font-size="12" fill="#6b645a">settings Json (7 полей) · mapSeed · status</text>

  <rect x="400" y="50" width="110" height="40" rx="6" fill="#ffffff" stroke="#3b2a1a" stroke-width="1.5"/>
  <text x="455" y="75" text-anchor="middle" fill="#3b2a1a">GameAdmin</text>
  <line x1="380" y1="70" x2="400" y2="70" stroke="#6b645a" stroke-width="1.5"/>

  <!-- Карта -->
  <rect x="20" y="120" width="490" height="70" rx="6" fill="none" stroke="#2e627e" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="30" y="138" font-size="12" fill="#2e627e">Карта (создаётся генератором один раз)</text>
  <rect x="30" y="146" width="130" height="36" rx="5" fill="#ffffff" stroke="#2e627e" stroke-width="1.5"/>
  <text x="95" y="162" text-anchor="middle" fill="#3b2a1a">MapHex</text>
  <text x="95" y="176" text-anchor="middle" font-size="11" fill="#6b645a">terrain · island</text>
  <rect x="172" y="146" width="210" height="36" rx="5" fill="#ffffff" stroke="#2e627e" stroke-width="1.5"/>
  <text x="277" y="162" text-anchor="middle" fill="#3b2a1a">MapNode</text>
  <text x="277" y="176" text-anchor="middle" font-size="11" fill="#6b645a">kind · book · cityKey · defenseLevel · ruined</text>
  <rect x="394" y="146" width="106" height="36" rx="5" fill="#ffffff" stroke="#2e627e" stroke-width="1.5"/>
  <text x="447" y="162" text-anchor="middle" fill="#3b2a1a">MapEdge</text>
  <text x="447" y="176" text-anchor="middle" font-size="11" fill="#6b645a">aKey · bKey</text>
  <line x1="280" y1="96" x2="280" y2="120" stroke="#6b645a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Команда -->
  <rect x="20" y="210" width="200" height="52" rx="6" fill="#ffffff" stroke="#3b2a1a" stroke-width="1.5"/>
  <text x="120" y="230" text-anchor="middle" font-weight="bold" fill="#3b2a1a">Team</text>
  <text x="120" y="248" text-anchor="middle" font-size="11" fill="#6b645a">status · capitalMovedAt · lastPeekAt · lastHintAt</text>
  <rect x="240" y="210" width="140" height="52" rx="6" fill="#ffffff" stroke="#3b2a1a" stroke-width="1.5"/>
  <text x="310" y="230" text-anchor="middle" fill="#3b2a1a">Membership</text>
  <text x="310" y="248" text-anchor="middle" font-size="11" fill="#6b645a">role · gameRole (enum)</text>
  <rect x="400" y="210" width="110" height="52" rx="6" fill="#ffffff" stroke="#3b2a1a" stroke-width="1.5"/>
  <text x="455" y="230" text-anchor="middle" fill="#3b2a1a">User</text>
  <text x="455" y="248" text-anchor="middle" font-size="11" fill="#6b645a">nickname · email</text>
  <line x1="220" y1="236" x2="240" y2="236" stroke="#6b645a" stroke-width="1.5"/>
  <line x1="380" y1="236" x2="400" y2="236" stroke="#6b645a" stroke-width="1.5"/>
  <line x1="120" y1="190" x2="120" y2="210" stroke="#6b645a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Состояние глазами команды -->
  <rect x="20" y="282" width="490" height="74" rx="6" fill="none" stroke="#4c7a3f" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="30" y="300" font-size="12" fill="#4c7a3f">Состояние «глазами команды» (отдельные таблицы на пару команда × узел)</text>
  <rect x="30" y="310" width="100" height="36" rx="5" fill="#ffffff" stroke="#4c7a3f" stroke-width="1.5"/>
  <text x="80" y="332" text-anchor="middle" font-size="12" fill="#3b2a1a">TeamNodeState</text>
  <rect x="138" y="310" width="110" height="36" rx="5" fill="#ffffff" stroke="#4c7a3f" stroke-width="1.5"/>
  <text x="193" y="326" text-anchor="middle" font-size="12" fill="#3b2a1a">TeamEdgeTask</text>
  <text x="193" y="340" text-anchor="middle" font-size="11" fill="#6b645a">→ Deed · links</text>
  <rect x="256" y="310" width="120" height="36" rx="5" fill="#ffffff" stroke="#4c7a3f" stroke-width="1.5"/>
  <text x="316" y="326" text-anchor="middle" font-size="12" fill="#3b2a1a">TeamCityState</text>
  <text x="316" y="340" text-anchor="middle" font-size="11" fill="#6b645a">doneTasks Int[]</text>
  <rect x="384" y="310" width="116" height="36" rx="5" fill="#ffffff" stroke="#4c7a3f" stroke-width="1.5"/>
  <text x="442" y="326" text-anchor="middle" font-size="12" fill="#3b2a1a">TeamTaskLock</text>
  <text x="442" y="340" text-anchor="middle" font-size="11" fill="#6b645a">TeamPeek</text>
  <line x1="120" y1="262" x2="120" y2="282" stroke="#6b645a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Взаимодействие команд -->
  <rect x="20" y="376" width="490" height="60" rx="6" fill="none" stroke="#c7742a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="30" y="394" font-size="12" fill="#c7742a">Взаимодействие команд и люди вне игры</text>
  <rect x="30" y="402" width="120" height="28" rx="5" fill="#ffffff" stroke="#c7742a" stroke-width="1.5"/>
  <text x="90" y="421" text-anchor="middle" font-size="12" fill="#3b2a1a">Battle → BattleEntry</text>
  <rect x="160" y="402" width="120" height="28" rx="5" fill="#ffffff" stroke="#c7742a" stroke-width="1.5"/>
  <text x="220" y="421" text-anchor="middle" font-size="12" fill="#3b2a1a">PassageRequest</text>
  <rect x="290" y="402" width="100" height="28" rx="5" fill="#ffffff" stroke="#c7742a" stroke-width="1.5"/>
  <text x="340" y="421" text-anchor="middle" font-size="12" fill="#3b2a1a">Recipient</text>
  <rect x="400" y="402" width="100" height="28" rx="5" fill="#ffffff" stroke="#c7742a" stroke-width="1.5"/>
  <text x="450" y="421" text-anchor="middle" font-size="12" fill="#3b2a1a">SupportRequest</text>

  <!-- Правая колонка: вне базы -->
  <rect x="530" y="50" width="170" height="386" rx="6" fill="#f7f4ee" stroke="#6b645a" stroke-width="1.5"/>
  <text x="615" y="72" text-anchor="middle" font-weight="bold" fill="#3b2a1a">Вне базы</text>
  <text x="540" y="98" font-size="12" fill="#3b2a1a">Правила — константы в коде:</text>
  <text x="540" y="114" font-size="11" fill="#6b645a">MIN_BID 10 · 14 дней · штраф 5</text>
  <text x="540" y="128" font-size="11" fill="#6b645a">2 попытки · сутки · 20 с</text>
  <text x="540" y="142" font-size="11" fill="#6b645a">проход 3 дня · роли раз в неделю</text>
  <text x="540" y="156" font-size="11" fill="#6b645a">веса дел 1:3:6 · окно 30</text>
  <line x1="540" y1="170" x2="690" y2="170" stroke="#6b645a" stroke-width="1"/>
  <text x="540" y="190" font-size="12" fill="#3b2a1a">События — SSE в памяти:</text>
  <text x="540" y="206" font-size="11" fill="#6b645a">8 типов, только «перечитай»,</text>
  <text x="540" y="220" font-size="11" fill="#6b645a">ничего не хранится</text>
  <line x1="540" y1="234" x2="690" y2="234" stroke="#6b645a" stroke-width="1"/>
  <text x="540" y="254" font-size="12" fill="#3b2a1a">Таймеры:</text>
  <text x="540" y="270" font-size="11" fill="#6b645a">setInterval 60 с → sweep()</text>
  <text x="540" y="284" font-size="11" fill="#6b645a">+ sweep(id) перед чтением битв</text>
  <text x="540" y="298" font-size="11" fill="#6b645a">уведомления без очереди</text>
  <line x1="540" y1="312" x2="690" y2="312" stroke="#6b645a" stroke-width="1"/>
  <text x="540" y="332" font-size="12" fill="#3b2a1a">Контент — файлы:</text>
  <text x="540" y="348" font-size="11" fill="#6b645a">content/cities/*.json (66)</text>
  <text x="540" y="362" font-size="11" fill="#6b645a">content/bible/*.json (13 МБ)</text>
  <text x="540" y="376" font-size="11" fill="#6b645a">content/deeds-default.json</text>
  <line x1="540" y1="390" x2="690" y2="390" stroke="#6b645a" stroke-width="1"/>
  <text x="540" y="410" font-size="12" fill="#3b2a1a">Нет: журнала, эффектов,</text>
  <text x="540" y="426" font-size="12" fill="#3b2a1a">очереди задач, снапшотов</text>

  <text x="20" y="470" font-size="12" fill="#6b645a">Синий — карта (неизменна после старта); зелёный — прогресс команды; охра — взаимодействие команд.</text>
  <text x="20" y="488" font-size="12" fill="#6b645a">Состояние города (defenseLevel, ruined, sumMode, lockedForever) хранится прямо на узле карты.</text>
  <text x="20" y="506" font-size="12" fill="#6b645a">Всё привязано к gameId: мультитенантность выполнена. Журнал действий из §5 документа не создан.</text>
  <text x="20" y="540" font-size="12" fill="#6b645a">Источник: apps/api/prisma/schema.prisma, apps/api/src/services/*.ts, apps/api/src/app.ts.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b645a"/>
    </marker>
  </defs>
</svg>
