<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="720" height="440" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b2a1a">Сетка дипломатических действий: что есть и что предлагается</text>
  <g fill="#3b2a1a" font-weight="bold">
    <text x="16" y="60">Действие между командами</text>
    <text x="330" y="60" text-anchor="middle">Сейчас</text>
    <text x="440" y="60" text-anchor="middle">Предложение</text>
    <text x="560" y="60" text-anchor="middle">Что отдаём / получаем</text>
  </g>
  <line x1="16" y1="68" x2="704" y2="68" stroke="#6b645a"/>
  <g fill="#3b2a1a">
    <text x="16" y="96">Разрешить проход через город</text>
    <text x="16" y="128">Сделка: пропуск за пропуск</text>
    <text x="16" y="160">Торг: разведка, подсказка, стихи</text>
    <text x="16" y="192">Союз на срок с общей целью</text>
    <text x="16" y="224">Посольство: участник на неделю</text>
    <text x="16" y="256">Дар (свиток со стихом)</text>
    <text x="16" y="288">Совет капитанов</text>
    <text x="16" y="320">Общий противник (руины-крепость)</text>
    <text x="16" y="352">Репутация честной команды</text>
    <text x="16" y="384">Наставник из другой команды</text>
  </g>
  <g stroke="#e0dbd3"><line x1="16" y1="104" x2="704" y2="104"/><line x1="16" y1="136" x2="704" y2="136"/><line x1="16" y1="168" x2="704" y2="168"/><line x1="16" y1="200" x2="704" y2="200"/><line x1="16" y1="232" x2="704" y2="232"/><line x1="16" y1="264" x2="704" y2="264"/><line x1="16" y1="296" x2="704" y2="296"/><line x1="16" y1="328" x2="704" y2="328"/><line x1="16" y1="360" x2="704" y2="360"/><line x1="16" y1="392" x2="704" y2="392"/></g>
  <!-- status chips: green = есть, ochre = описано, нет в коде, grey = нет -->
  <g font-size="13" text-anchor="middle">
    <rect x="290" y="80" width="80" height="20" rx="10" fill="#4c7a3f"/><text x="330" y="94" fill="#ffffff">есть</text>
    <rect x="290" y="112" width="80" height="20" rx="10" fill="#c7742a"/><text x="330" y="126" fill="#ffffff">в док., не в коде</text>
    <rect x="290" y="144" width="80" height="20" rx="10" fill="#6b645a"/><text x="330" y="158" fill="#ffffff">нет</text>
    <rect x="290" y="176" width="80" height="20" rx="10" fill="#6b645a"/><text x="330" y="190" fill="#ffffff">нет</text>
    <rect x="290" y="208" width="80" height="20" rx="10" fill="#6b645a"/><text x="330" y="222" fill="#ffffff">нет</text>
    <rect x="290" y="240" width="80" height="20" rx="10" fill="#6b645a"/><text x="330" y="254" fill="#ffffff">нет</text>
    <rect x="290" y="272" width="80" height="20" rx="10" fill="#6b645a"/><text x="330" y="286" fill="#ffffff">нет</text>
    <rect x="290" y="304" width="80" height="20" rx="10" fill="#6b645a"/><text x="330" y="318" fill="#ffffff">нет</text>
    <rect x="290" y="336" width="80" height="20" rx="10" fill="#6b645a"/><text x="330" y="350" fill="#ffffff">нет</text>
    <rect x="290" y="368" width="80" height="20" rx="10" fill="#6b645a"/><text x="330" y="382" fill="#ffffff">нет</text>
  </g>
  <g fill="#2e627e" text-anchor="middle" font-weight="bold">
    <text x="440" y="96">—</text><text x="440" y="128">R-01</text><text x="440" y="160">R-02</text><text x="440" y="192">R-03</text><text x="440" y="224">R-04</text>
    <text x="440" y="256">R-12</text><text x="440" y="288">R-05</text><text x="440" y="320">R-13</text><text x="440" y="352">R-11</text><text x="440" y="384">R-10</text>
  </g>
  <g fill="#3b2a1a" font-size="13">
    <text x="490" y="96">ничего / проход</text>
    <text x="490" y="128">пропуск / пропуск</text>
    <text x="490" y="160">1 разведка = 1 подсказка = 1 пропуск</text>
    <text x="490" y="192">общая цель / общий бонус</text>
    <text x="490" y="224">человек на 7 дней / дела</text>
    <text x="490" y="256">стих / доверие (+1)</text>
    <text x="490" y="288">время / договорённости</text>
    <text x="490" y="320">две команды / руины делятся</text>
    <text x="490" y="352">честность / скидка на ответ</text>
    <text x="490" y="384">час в неделю / удержание</text>
  </g>
  <text x="360" y="424" text-anchor="middle" fill="#6b645a" font-size="13">Единственное реализованное действие — разрешить или отказать. Всё остальное — предложения этой главы.</text>
</svg>
