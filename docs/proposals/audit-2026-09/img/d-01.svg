<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="sans-serif" font-size="14">
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#3b2a1a">Покрытие направлений служения делами: набор сейчас (21) и после D-01 (+20)</text>
  <!-- легенда -->
  <rect x="20" y="42" width="16" height="12" fill="#c7742a"/>
  <text x="42" y="53" fill="#3b2a1a">в наборе сейчас</text>
  <rect x="180" y="42" width="16" height="12" fill="#4c7a3f"/>
  <text x="202" y="53" fill="#3b2a1a">предложено добавить</text>
  <text x="380" y="53" fill="#6b645a">1 клетка = 1 дело; шкала до 8</text>
  <!-- сетка -->
  <g stroke="#e6e1d8" stroke-width="1">
    <line x1="300" y1="70" x2="300" y2="430"/>
    <line x1="340" y1="70" x2="340" y2="430"/>
    <line x1="380" y1="70" x2="380" y2="430"/>
    <line x1="420" y1="70" x2="420" y2="430"/>
    <line x1="460" y1="70" x2="460" y2="430"/>
    <line x1="500" y1="70" x2="500" y2="430"/>
    <line x1="540" y1="70" x2="540" y2="430"/>
    <line x1="580" y1="70" x2="580" y2="430"/>
    <line x1="620" y1="70" x2="620" y2="430"/>
  </g>
  <g fill="#6b645a" font-size="12">
    <text x="296" y="445">0</text>
    <text x="376" y="445">2</text>
    <text x="456" y="445">4</text>
    <text x="536" y="445">6</text>
    <text x="616" y="445">8</text>
  </g>
  <!-- Молитва: 2 + 3 -->
  <text x="20" y="96" fill="#3b2a1a">Молитва</text>
  <rect x="300" y="82" width="80" height="20" fill="#c7742a"/>
  <rect x="380" y="82" width="120" height="20" fill="#4c7a3f"/>
  <text x="508" y="97" fill="#6b645a">2 → 5</text>
  <!-- Молодёжные нужды братства: 2 + 2 -->
  <text x="20" y="140" fill="#3b2a1a">Молодёжные нужды братства</text>
  <rect x="300" y="126" width="80" height="20" fill="#c7742a"/>
  <rect x="380" y="126" width="80" height="20" fill="#4c7a3f"/>
  <text x="468" y="141" fill="#6b645a">2 → 4</text>
  <!-- Благовестие: 2 + 4 -->
  <text x="20" y="184" fill="#3b2a1a">Благовестие</text>
  <rect x="300" y="170" width="80" height="20" fill="#c7742a"/>
  <rect x="380" y="170" width="160" height="20" fill="#4c7a3f"/>
  <text x="548" y="185" fill="#6b645a">2 → 6</text>
  <text x="20" y="200" fill="#c7742a" font-size="12">из двух нынешних лишь одно обращено к людям вне церкви</text>
  <!-- Посещение: 3 + 4 -->
  <text x="20" y="228" fill="#3b2a1a">Посещение</text>
  <rect x="300" y="214" width="120" height="20" fill="#c7742a"/>
  <rect x="420" y="214" width="160" height="20" fill="#4c7a3f"/>
  <text x="588" y="229" fill="#6b645a">3 → 7</text>
  <!-- Помощь миссионерам и большим семьям: 4 + 2 -->
  <text x="20" y="272" fill="#3b2a1a">Помощь миссионерам и большим семьям</text>
  <rect x="300" y="258" width="160" height="20" fill="#c7742a"/>
  <rect x="460" y="258" width="80" height="20" fill="#4c7a3f"/>
  <text x="548" y="273" fill="#6b645a">4 → 6</text>
  <!-- Труд в лагерях и домах молитвы: 6 + 2 -->
  <text x="20" y="316" fill="#3b2a1a">Труд в лагерях и домах молитвы</text>
  <rect x="300" y="302" width="240" height="20" fill="#c7742a"/>
  <rect x="540" y="302" width="80" height="20" fill="#4c7a3f"/>
  <text x="628" y="317" fill="#6b645a">6 → 8</text>
  <text x="20" y="332" fill="#c7742a" font-size="12">о лагерях — ни одного; три из шести — участие в служении, а не труд</text>
  <!-- Педагогическое служение: 2 + 3 -->
  <text x="20" y="360" fill="#3b2a1a">Педагогическое служение</text>
  <rect x="300" y="346" width="80" height="20" fill="#c7742a"/>
  <rect x="380" y="346" width="120" height="20" fill="#4c7a3f"/>
  <text x="508" y="361" fill="#6b645a">2 → 5</text>
  <!-- Финансовое участие -->
  <text x="20" y="404" fill="#3b2a1a">Финансовое участие</text>
  <rect x="300" y="390" width="4" height="20" fill="#6b645a"/>
  <text x="312" y="405" fill="#6b645a">0 — по решению владельца: только замена любого дела пожертвованием</text>
  <line x1="20" y1="424" x2="700" y2="424" stroke="#6b645a" stroke-width="1"/>
  <text x="20" y="462" fill="#2e627e" font-size="13">Итого 21 → 41; дистанционных (можно сделать издалека или болея) сейчас 2, станет 9.</text>
</svg>
