<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="720" height="430" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b2a1a">M-05. Места силы: особые развилки на карте</text>
  <!-- Схема графа: обычные развилки и четыре особых -->
  <g stroke="#6b645a" stroke-width="2">
    <line x1="80" y1="120" x2="160" y2="90"/><line x1="160" y1="90" x2="240" y2="120"/><line x1="240" y1="120" x2="320" y2="90"/>
    <line x1="80" y1="120" x2="120" y2="190"/><line x1="240" y1="120" x2="280" y2="190"/><line x1="120" y1="190" x2="200" y2="220"/>
    <line x1="200" y1="220" x2="280" y2="190"/><line x1="320" y1="90" x2="360" y2="160"/><line x1="280" y1="190" x2="360" y2="160"/>
  </g>
  <g fill="#ffffff" stroke="#6b645a" stroke-width="2">
    <circle cx="80" cy="120" r="6"/><circle cx="160" cy="90" r="6"/><circle cx="320" cy="90" r="6"/>
    <circle cx="120" cy="190" r="6"/><circle cx="280" cy="190" r="6"/>
  </g>
  <!-- особые узлы -->
  <circle cx="240" cy="120" r="12" fill="#2e627e"/>
  <text x="240" y="125" text-anchor="middle" font-size="11" fill="#ffffff">И</text>
  <circle cx="200" cy="220" r="12" fill="#6b645a"/>
  <text x="200" y="225" text-anchor="middle" font-size="11" fill="#ffffff">С</text>
  <circle cx="360" cy="160" r="12" fill="#c7742a"/>
  <text x="360" y="165" text-anchor="middle" font-size="11" fill="#ffffff">В</text>
  <text x="240" y="150" text-anchor="middle" fill="#3b2a1a" font-size="13">Иордан</text>
  <text x="200" y="250" text-anchor="middle" fill="#3b2a1a" font-size="13">Синай</text>
  <text x="360" y="190" text-anchor="middle" fill="#3b2a1a" font-size="13">Вифлеем</text>
  <text x="80" y="230" fill="#6b645a" font-size="12">Обычная развилка: ничего не даёт.</text>
  <text x="80" y="248" fill="#6b645a" font-size="12">Место силы: пустая развилка с именем и одним правилом.</text>
  <!-- Таблица правил -->
  <rect x="400" y="60" width="290" height="200" rx="10" fill="#ffffff" stroke="#3b2a1a" stroke-width="1.5"/>
  <text x="415" y="84" font-weight="bold" fill="#3b2a1a">Что даёт место (один раз на команду)</text>
  <text x="415" y="110" fill="#2e627e" font-weight="bold">Иордан</text>
  <text x="415" y="128" fill="#3b2a1a" font-size="13">разведчик смотрит за 3 стороны сразу</text>
  <text x="415" y="154" fill="#6b645a" font-weight="bold">Синай</text>
  <text x="415" y="172" fill="#3b2a1a" font-size="13">пророк: 2 подсказки на неделе вместо 1</text>
  <text x="415" y="198" fill="#c7742a" font-weight="bold">Вифлеем</text>
  <text x="415" y="216" fill="#3b2a1a" font-size="13">ближайший свободный город: −1 район</text>
  <text x="415" y="242" fill="#4c7a3f" font-weight="bold">Силом / Сихем / Кармил…</text>
  <!-- Генератор -->
  <rect x="40" y="280" width="650" height="130" rx="10" fill="#ffffff" stroke="#3b2a1a" stroke-width="1.5"/>
  <text x="60" y="305" font-weight="bold" fill="#3b2a1a">Как ложится на генератор</text>
  <text x="60" y="328" fill="#3b2a1a" font-size="13">1. После расстановки городов выбираются 4–6 пустых развилок на расстоянии 2–3 сторон от ближайшего города.</text>
  <text x="60" y="348" fill="#3b2a1a" font-size="13">2. Место получает имя и тип из списка (Иордан — только на узле у воды, Синай — у гор, Вифлеем — у луга).</text>
  <text x="60" y="368" fill="#3b2a1a" font-size="13">3. Проверка: от каждого старта до ближайшего места — не больше 5 сторон; иначе перегенерация.</text>
  <text x="60" y="388" fill="#3b2a1a" font-size="13">4. Место видно на карте команды как обычный узел до открытия; после — с именем и знаком.</text>
</svg>
