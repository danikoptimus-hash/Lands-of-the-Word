<text x="20" y="288" font-size="13" fill="#6b645a" text-anchor="start" font-weight="normal">Правило светофора: 7 дней без сдачи — оранжевый, 14 дней или ни одного активного — тёмный.</text>
<text x="20" y="308" font-size="13" fill="#6b645a" text-anchor="start" font-weight="normal">«Активных» — участники, заходившие в игру за 7 дней. Кнопка «написать» шлёт капитану шаблон письма.</text>
