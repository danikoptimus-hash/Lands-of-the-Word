<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#3b2a1a">Таймлайн испытания и точки несправедливости</text>

  <!-- Ось времени -->
  <line x1="40" y1="150" x2="690" y2="150" stroke="#3b2a1a" stroke-width="2"/>
  <polygon points="690,144 702,150 690,156" fill="#3b2a1a"/>

  <!-- Фаза вызова -->
  <rect x="60" y="120" width="230" height="30" fill="#2e627e" opacity="0.15" stroke="#2e627e"/>
  <text x="175" y="140" text-anchor="middle" fill="#2e627e" font-weight="bold">Вызов: T (≤ 14 дней)</text>
  <!-- Проверка -->
  <rect x="290" y="120" width="90" height="30" fill="#6b645a" opacity="0.15" stroke="#6b645a"/>
  <text x="335" y="140" text-anchor="middle" fill="#6b645a">проверка</text>
  <!-- Фаза ответа -->
  <rect x="380" y="120" width="230" height="30" fill="#4c7a3f" opacity="0.15" stroke="#4c7a3f"/>
  <text x="495" y="140" text-anchor="middle" fill="#4c7a3f" font-weight="bold">Ответ: ровно T</text>
  <rect x="610" y="120" width="70" height="30" fill="#6b645a" opacity="0.15" stroke="#6b645a"/>
  <text x="645" y="140" text-anchor="middle" fill="#6b645a">проверка</text>

  <!-- Вехи -->
  <circle cx="60" cy="150" r="6" fill="#3b2a1a"/>
  <text x="60" y="175" text-anchor="middle" fill="#3b2a1a">объявление</text>
  <circle cx="290" cy="150" r="6" fill="#3b2a1a"/>
  <text x="290" y="175" text-anchor="middle" fill="#3b2a1a">отправка вызова</text>
  <circle cx="380" cy="150" r="6" fill="#3b2a1a"/>
  <text x="380" y="195" text-anchor="middle" fill="#3b2a1a">одобрение</text>
  <circle cx="610" cy="150" r="6" fill="#3b2a1a"/>
  <text x="610" y="175" text-anchor="middle" fill="#3b2a1a">дедлайн ответа</text>

  <!-- Точки несправедливости -->
  <g>
    <circle cx="120" cy="95" r="12" fill="#c7742a"/>
    <text x="120" y="100" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
    <line x1="120" y1="107" x2="120" y2="120" stroke="#c7742a" stroke-width="2"/>
  </g>
  <g>
    <circle cx="290" cy="95" r="12" fill="#c7742a"/>
    <text x="290" y="100" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
    <line x1="290" y1="107" x2="290" y2="120" stroke="#c7742a" stroke-width="2"/>
  </g>
  <g>
    <circle cx="380" cy="95" r="12" fill="#c7742a"/>
    <text x="380" y="100" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
    <line x1="380" y1="107" x2="380" y2="120" stroke="#c7742a" stroke-width="2"/>
  </g>
  <g>
    <circle cx="495" cy="95" r="12" fill="#c7742a"/>
    <text x="495" y="100" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
    <line x1="495" y1="107" x2="495" y2="120" stroke="#c7742a" stroke-width="2"/>
  </g>
  <g>
    <circle cx="645" cy="95" r="12" fill="#c7742a"/>
    <text x="645" y="100" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
    <line x1="645" y1="107" x2="645" y2="120" stroke="#c7742a" stroke-width="2"/>
  </g>

  <!-- Легенда -->
  <rect x="40" y="215" width="640" height="165" fill="#ffffff" stroke="#6b645a" rx="6"/>
  <text x="56" y="240" fill="#3b2a1a"><tspan font-weight="bold" fill="#c7742a">1.</tspan> Претенденты сами выбирают момент старта и темп: блиц «8 человек по 2 стиха за вечер» даёт T = 3 часа.</text>
  <text x="56" y="266" fill="#3b2a1a"><tspan font-weight="bold" fill="#c7742a">2.</tspan> T фиксируется отправкой; в коде нижний предел T — 60 секунд, верхнего смысла «ровно» никто не проверяет.</text>
  <text x="56" y="292" fill="#3b2a1a"><tspan font-weight="bold" fill="#c7742a">3.</tspan> Часы ответа запускает администратор, когда одобрил, — хоть в 23:40, хоть в понедельник сессии.</text>
  <text x="56" y="318" fill="#3b2a1a"><tspan font-weight="bold" fill="#c7742a">4.</tspan> Внутри T хранителей — ночи и будни, которых они не выбирали; претенденты свои ночи выбрали сами.</text>
  <text x="56" y="344" fill="#3b2a1a"><tspan font-weight="bold" fill="#c7742a">5.</tspan> Запись хранителей возвращена после дедлайна — город потерян сразу; претендентам возврат стоит лишь роста T.</text>
  <text x="56" y="370" fill="#6b645a" font-size="13">Синий — время претендентов, зелёный — хранителей, серый — ожидание проверки (в T не входит).</text>
</svg>
