<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b2a1a">«Снежный ком»: число городов по неделям, три команды по 8 человек</text>

  <!-- сетка -->
  <g stroke="#e6e1d8" stroke-width="1">
    <line x1="70" y1="300" x2="650" y2="300"/>
    <line x1="70" y1="235" x2="650" y2="235"/>
    <line x1="70" y1="170" x2="650" y2="170"/>
    <line x1="70" y1="105" x2="650" y2="105"/>
    <line x1="70" y1="40" x2="650" y2="40"/>
  </g>
  <!-- оси -->
  <line x1="70" y1="40" x2="70" y2="300" stroke="#3b2a1a" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="650" y2="300" stroke="#3b2a1a" stroke-width="1.5"/>
  <g fill="#6b645a" font-size="13">
    <text x="60" y="305" text-anchor="end">0</text>
    <text x="60" y="240" text-anchor="end">5</text>
    <text x="60" y="175" text-anchor="end">10</text>
    <text x="60" y="110" text-anchor="end">15</text>
    <text x="60" y="45" text-anchor="end">20</text>
    <text x="70" y="322" text-anchor="middle">0</text>
    <text x="158" y="322" text-anchor="middle">4</text>
    <text x="246" y="322" text-anchor="middle">8</text>
    <text x="334" y="322" text-anchor="middle">12</text>
    <text x="422" y="322" text-anchor="middle">16</text>
    <text x="510" y="322" text-anchor="middle">20</text>
    <text x="598" y="322" text-anchor="middle">24</text>
    <text x="650" y="322" text-anchor="middle">26</text>
    <text x="360" y="344" text-anchor="middle">недели игры</text>
    <text x="22" y="170" text-anchor="middle" transform="rotate(-90 22 170)">городов у команды</text>
  </g>

  <!-- событие: неделя 16 -->
  <line x1="422" y1="40" x2="422" y2="300" stroke="#c7742a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="428" y="56" fill="#c7742a" font-size="13">нед. 16: «Пустыня» теряет столицу,</text>
  <text x="428" y="72" fill="#c7742a" font-size="13">4 руины уходят «Морякам», 1 — «Берегу»,</text>
  <text x="428" y="88" fill="#c7742a" font-size="13">по 2 участника — в каждую команду</text>

  <!-- Моряки -->
  <polyline fill="none" stroke="#2e627e" stroke-width="3" points="70,300 114,287 158,274 202,261 246,248 290,235 334,222 378,209 422,196 424,144 466,131 510,118 554,105 598,105 650,92"/>
  <!-- Берег -->
  <polyline fill="none" stroke="#4c7a3f" stroke-width="3" points="70,300 114,287 158,274 202,274 246,261 290,248 334,235 378,235 422,222 444,209 510,196 554,183 650,183"/>
  <!-- Пустыня -->
  <polyline fill="none" stroke="#6b645a" stroke-width="3" points="70,300 114,300 158,287 202,274 246,274 290,261 334,261 378,248 400,235 416,248 422,300"/>

  <!-- подписи линий -->
  <text x="656" y="96" fill="#2e627e" font-weight="bold">Моряки 16</text>
  <text x="656" y="187" fill="#4c7a3f" font-weight="bold">Берег 9</text>
  <text x="330" y="282" fill="#6b645a" font-weight="bold">Пустыня</text>
  <text x="440" y="296" fill="#6b645a" font-size="13">выбыла</text>

  <!-- легенда внизу -->
  <rect x="80" y="356" width="560" height="34" rx="6" fill="#ffffff" stroke="#6b645a"/>
  <text x="360" y="378" text-anchor="middle" fill="#3b2a1a" font-size="13">До выбывания разрыв 2–3 города; после — 7, и «Берегу» нужно 7 успешных атак против защитника с 10 людьми</text>
</svg>
