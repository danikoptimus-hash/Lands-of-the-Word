<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b2a1a">M-03. Календарь сезона: 24 недели, четыре «времени года»</text>
  <!-- Четыре времени -->
  <g stroke="#3b2a1a" stroke-width="1.5">
    <rect x="40" y="60" width="160" height="60" rx="8" fill="#4c7a3f" fill-opacity="0.3"/>
    <rect x="200" y="60" width="160" height="60" rx="8" fill="#c7742a" fill-opacity="0.35"/>
    <rect x="360" y="60" width="160" height="60" rx="8" fill="#2e627e" fill-opacity="0.3"/>
    <rect x="520" y="60" width="160" height="60" rx="8" fill="#6b645a" fill-opacity="0.3"/>
  </g>
  <g text-anchor="middle" fill="#3b2a1a" font-weight="bold">
    <text x="120" y="84">Сев · нед. 1–6</text>
    <text x="280" y="84">Жатва · нед. 7–12</text>
    <text x="440" y="84">Ветра · нед. 13–18</text>
    <text x="600" y="84">Праздники · нед. 19–24</text>
  </g>
  <g text-anchor="middle" fill="#3b2a1a" font-size="13">
    <text x="120" y="106">луга −1 к сложности</text>
    <text x="280" y="106">дела «помощь» ×2 узла</text>
    <text x="440" y="106">переправа за 1 день</text>
    <text x="600" y="106">паломничество открыто</text>
  </g>
  <!-- Шкала недель -->
  <line x1="40" y1="170" x2="680" y2="170" stroke="#3b2a1a" stroke-width="2"/>
  <g fill="#3b2a1a" font-size="12" text-anchor="middle">
    <text x="53" y="190">1</text><text x="133" y="190">4</text><text x="213" y="190">7</text><text x="293" y="190">10</text>
    <text x="373" y="190">13</text><text x="453" y="190">16</text><text x="533" y="190">19</text><text x="613" y="190">22</text><text x="680" y="190">24</text>
  </g>
  <g stroke="#3b2a1a" stroke-width="1">
    <line x1="53" y1="164" x2="53" y2="176"/><line x1="133" y1="164" x2="133" y2="176"/><line x1="213" y1="164" x2="213" y2="176"/>
    <line x1="293" y1="164" x2="293" y2="176"/><line x1="373" y1="164" x2="373" y2="176"/><line x1="453" y1="164" x2="453" y2="176"/>
    <line x1="533" y1="164" x2="533" y2="176"/><line x1="613" y1="164" x2="613" y2="176"/><line x1="680" y1="164" x2="680" y2="176"/>
  </g>
  <!-- События недели (случайные, объявляются в понедельник) -->
  <g>
    <circle cx="160" cy="150" r="9" fill="#2e627e"/>
    <text x="160" y="154" text-anchor="middle" font-size="11" fill="#ffffff">Д</text>
    <circle cx="240" cy="150" r="9" fill="#c7742a"/>
    <text x="240" y="154" text-anchor="middle" font-size="11" fill="#ffffff">З</text>
    <circle cx="400" cy="150" r="9" fill="#4c7a3f"/>
    <text x="400" y="154" text-anchor="middle" font-size="11" fill="#ffffff">В</text>
    <circle cx="480" cy="150" r="9" fill="#6b645a"/>
    <text x="480" y="154" text-anchor="middle" font-size="11" fill="#ffffff">Ш</text>
    <circle cx="640" cy="150" r="9" fill="#4c7a3f"/>
    <text x="640" y="154" text-anchor="middle" font-size="11" fill="#ffffff">В</text>
  </g>
  <!-- Легенда событий -->
  <rect x="40" y="215" width="640" height="165" rx="10" fill="#ffffff" stroke="#3b2a1a" stroke-width="1.5"/>
  <text x="60" y="240" font-weight="bold" fill="#3b2a1a">События недели (не больше одного, объявляется в понедельник в 9:00)</text>
  <circle cx="70" cy="266" r="9" fill="#2e627e"/><text x="70" y="270" text-anchor="middle" font-size="11" fill="#ffffff">Д</text>
  <text x="90" y="270" fill="#3b2a1a">Дождь: пустыня цветёт — стороны у пустыни на неделю считаются лугом.</text>
  <circle cx="70" cy="294" r="9" fill="#c7742a"/><text x="70" y="298" text-anchor="middle" font-size="11" fill="#ffffff">З</text>
  <text x="90" y="298" fill="#3b2a1a">Засуха: колодцы закрыты; дело «пост и молитва» открывает любую сторону.</text>
  <circle cx="70" cy="322" r="9" fill="#4c7a3f"/><text x="70" y="326" text-anchor="middle" font-size="11" fill="#ffffff">В</text>
  <text x="90" y="326" fill="#3b2a1a">Попутный ветер: морское дело из порта считается с половинной проверкой.</text>
  <circle cx="70" cy="350" r="9" fill="#6b645a"/><text x="70" y="354" text-anchor="middle" font-size="11" fill="#ffffff">Ш</text>
  <text x="90" y="354" fill="#3b2a1a">Шторм: переправа закрыта до понедельника; корабли стоят в портах.</text>
  <text x="60" y="374" fill="#6b645a" font-size="12">Календарь виден всем командам заранее; события — за неделю (кроме шторма: за 2 дня).</text>
</svg>
