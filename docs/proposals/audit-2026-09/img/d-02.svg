<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b2a1a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#c7742a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#3b2a1a">Цикл дела и точки трения (как реализовано в teamMap.ts)</text>
  <!-- пять шагов -->
  <g stroke="#2e627e" stroke-width="2" fill="#ffffff">
    <rect x="20" y="60" width="116" height="56" rx="6"/>
    <rect x="164" y="60" width="116" height="56" rx="6"/>
    <rect x="308" y="60" width="116" height="56" rx="6"/>
    <rect x="452" y="60" width="116" height="56" rx="6"/>
    <rect x="596" y="60" width="110" height="56" rx="6"/>
  </g>
  <g fill="#3b2a1a" text-anchor="middle" font-weight="bold">
    <text x="78" y="84">1. Взять</text>
    <text x="222" y="84">2. Сделать</text>
    <text x="366" y="84">3. Сдать</text>
    <text x="510" y="84">4. Проверить</text>
    <text x="651" y="84">5. Открыть</text>
  </g>
  <g fill="#6b645a" text-anchor="middle" font-size="12">
    <text x="78" y="104">OPEN → TAKEN</text>
    <text x="222" y="104">в реальной жизни</text>
    <text x="366" y="104">ссылки + отчёт</text>
    <text x="510" y="104">администратор</text>
    <text x="651" y="104">узел за стороной</text>
  </g>
  <g stroke="#3b2a1a" stroke-width="2" marker-end="url(#arr)">
    <line x1="136" y1="88" x2="162" y2="88"/>
    <line x1="280" y1="88" x2="306" y2="88"/>
    <line x1="424" y1="88" x2="450" y2="88"/>
    <line x1="568" y1="88" x2="594" y2="88"/>
  </g>
  <!-- возврат на доработку -->
  <path d="M510,116 L510,140 L366,140 L366,118" fill="none" stroke="#c7742a" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="438" y="156" fill="#c7742a" text-anchor="middle" font-size="12">вернуть (REJECTED → снова можно взять)</text>
  <!-- отпустить -->
  <path d="M222,116 L222,132 L78,132 L78,118" fill="none" stroke="#6b645a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="150" y="146" fill="#6b645a" text-anchor="middle" font-size="12">отпустить (взявший, капитан, летописец)</text>
  <!-- точки трения -->
  <text x="20" y="190" font-size="15" font-weight="bold" fill="#c7742a">Точки трения</text>
  <g fill="#c7742a" font-weight="bold">
    <circle cx="30" cy="212" r="9" fill="#c7742a"/>
    <text x="30" y="217" fill="#ffffff" text-anchor="middle" font-size="12">1</text>
    <circle cx="30" cy="248" r="9" fill="#c7742a"/>
    <text x="30" y="253" fill="#ffffff" text-anchor="middle" font-size="12">2</text>
    <circle cx="30" cy="284" r="9" fill="#c7742a"/>
    <text x="30" y="289" fill="#ffffff" text-anchor="middle" font-size="12">3</text>
    <circle cx="30" cy="320" r="9" fill="#c7742a"/>
    <text x="30" y="325" fill="#ffffff" text-anchor="middle" font-size="12">4</text>
    <circle cx="30" cy="356" r="9" fill="#c7742a"/>
    <text x="30" y="361" fill="#ffffff" text-anchor="middle" font-size="12">5</text>
  </g>
  <g fill="#3b2a1a" font-size="13">
    <text x="48" y="217">Взять: берут активные; тяжесть не видна команде и ни на что не влияет — выбирают сторону с самым лёгким делом.</text>
    <text x="48" y="253">Сделать: дело «посидеть с ребёнком» и «разложить сборники» стоят одинаково — одну сторону; нет дел издалека.</text>
    <text x="48" y="289">Сдать: «подтверждение» и «отчёт» технически одно и то же (ссылка или 5 символов текста); файлы не принимаются.</text>
    <text x="48" y="325">Проверить: письмо администратору на каждую сдачу; проверить нечего, кроме фото, — доверие без опоры.</text>
    <text x="48" y="361">Открыть: получатель дела ничего не знает об игре и не может сказать «спасибо»; дело кончается кликом.</text>
  </g>
  <text x="20" y="390" fill="#2e627e" font-size="12">Метки: 1 → D-03, D-14; 2 → D-01, D-13; 3 → D-04, D-05; 4 → D-16; 5 → D-12.</text>
</svg>
