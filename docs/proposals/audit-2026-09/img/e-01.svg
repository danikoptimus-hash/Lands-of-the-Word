<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="sans-serif" font-size="14">
  <rect width="720" height="470" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b2a1a">Петля мотивации: участник (дни) → команда (недели) → сезон (месяцы)</text>

  <!-- внутренняя петля участника -->
  <rect x="20" y="50" width="680" height="200" fill="none" stroke="#6b645a" stroke-dasharray="4 3"/>
  <text x="32" y="70" fill="#6b645a" font-size="14">Петля участника: 1 дело ≈ 3–7 дней</text>

  <rect x="40" y="90" width="120" height="50" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="100" y="111" text-anchor="middle" fill="#3b2a1a">Открыл игру</text>
  <text x="100" y="129" text-anchor="middle" fill="#6b645a" font-size="12">зачем? — дыра</text>

  <rect x="200" y="90" width="120" height="50" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="260" y="111" text-anchor="middle" fill="#3b2a1a">Взял дело</text>
  <text x="260" y="129" text-anchor="middle" fill="#6b645a" font-size="12">выбор из 3 сторон</text>

  <rect x="360" y="90" width="140" height="50" rx="6" fill="#ffffff" stroke="#4c7a3f" stroke-width="2"/>
  <text x="430" y="111" text-anchor="middle" fill="#3b2a1a">Сделал в жизни</text>
  <text x="430" y="129" text-anchor="middle" fill="#6b645a" font-size="12">офлайн, 1–5 дней</text>

  <rect x="540" y="90" width="140" height="50" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="610" y="111" text-anchor="middle" fill="#3b2a1a">Сдал ссылку</text>
  <text x="610" y="129" text-anchor="middle" fill="#6b645a" font-size="12">фото / видео / отчёт</text>

  <rect x="540" y="180" width="140" height="50" rx="6" fill="#fff4e8" stroke="#c7742a" stroke-width="2"/>
  <text x="610" y="201" text-anchor="middle" fill="#3b2a1a">Ждёт проверки</text>
  <text x="610" y="219" text-anchor="middle" fill="#c7742a" font-size="12">мёртвая зона: часы–дни</text>

  <rect x="360" y="180" width="140" height="50" rx="6" fill="#ffffff" stroke="#4c7a3f" stroke-width="2"/>
  <text x="430" y="201" text-anchor="middle" fill="#3b2a1a">Сторона открылась</text>
  <text x="430" y="219" text-anchor="middle" fill="#6b645a" font-size="12">видит новый перекрёсток</text>

  <rect x="200" y="180" width="120" height="50" rx="6" fill="#fff4e8" stroke="#c7742a" stroke-width="2"/>
  <text x="260" y="201" text-anchor="middle" fill="#3b2a1a">Нет своего дела</text>
  <text x="260" y="219" text-anchor="middle" fill="#c7742a" font-size="12">8 чел. на 3–4 дела</text>

  <!-- стрелки -->
  <line x1="160" y1="115" x2="200" y2="115" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="320" y1="115" x2="360" y2="115" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="115" x2="540" y2="115" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="610" y1="140" x2="610" y2="180" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="205" x2="500" y2="205" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="205" x2="320" y2="205" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M200 205 L100 205 L100 140" fill="none" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="240" text-anchor="middle" fill="#6b645a" font-size="12">возврат к «зачем открывать?»</text>

  <!-- петля команды -->
  <rect x="20" y="270" width="680" height="90" fill="none" stroke="#6b645a" stroke-dasharray="4 3"/>
  <text x="32" y="290" fill="#6b645a" font-size="14">Петля команды: 1 город ≈ 2–4 недели</text>
  <rect x="40" y="300" width="110" height="44" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="95" y="327" text-anchor="middle" fill="#3b2a1a">3–4 дела/нед.</text>
  <rect x="180" y="300" width="110" height="44" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="235" y="327" text-anchor="middle" fill="#3b2a1a">Дошли до города</text>
  <rect x="320" y="300" width="110" height="44" rx="6" fill="#ffffff" stroke="#4c7a3f" stroke-width="2"/>
  <text x="375" y="327" text-anchor="middle" fill="#3b2a1a">Районы (5–16)</text>
  <rect x="460" y="300" width="110" height="44" rx="6" fill="#fff4e8" stroke="#c7742a" stroke-width="2"/>
  <text x="515" y="321" text-anchor="middle" fill="#3b2a1a">Конверт</text>
  <text x="515" y="337" text-anchor="middle" fill="#c7742a" font-size="12">офлайн-ожидание</text>
  <rect x="600" y="300" width="90" height="44" rx="6" fill="#ffffff" stroke="#4c7a3f" stroke-width="2"/>
  <text x="645" y="327" text-anchor="middle" fill="#3b2a1a">Город наш</text>
  <line x1="150" y1="322" x2="180" y2="322" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="290" y1="322" x2="320" y2="322" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="430" y1="322" x2="460" y2="322" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="570" y1="322" x2="600" y2="322" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>

  <!-- петля сезона -->
  <rect x="20" y="380" width="680" height="70" fill="none" stroke="#6b645a" stroke-dasharray="4 3"/>
  <text x="32" y="400" fill="#6b645a" font-size="14">Петля сезона: 26 недель</text>
  <rect x="40" y="410" width="150" height="30" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="115" y="430" text-anchor="middle" fill="#3b2a1a">Старт: туман, 3 стороны</text>
  <rect x="220" y="410" width="150" height="30" rx="6" fill="#fff4e8" stroke="#c7742a" stroke-width="2"/>
  <text x="295" y="430" text-anchor="middle" fill="#3b2a1a">Середина: без событий</text>
  <rect x="400" y="410" width="140" height="30" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="470" y="430" text-anchor="middle" fill="#3b2a1a">Испытания столиц</text>
  <rect x="570" y="410" width="120" height="30" rx="6" fill="#fff4e8" stroke="#c7742a" stroke-width="2"/>
  <text x="630" y="430" text-anchor="middle" fill="#3b2a1a">Финал письмом</text>
  <line x1="190" y1="425" x2="220" y2="425" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="425" x2="400" y2="425" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="425" x2="570" y2="425" stroke="#3b2a1a" stroke-width="2" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#3b2a1a"/>
    </marker>
  </defs>
</svg>
