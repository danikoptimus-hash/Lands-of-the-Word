<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">
  <rect width="720" height="760" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b645a"/>
    </marker>
  </defs>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b2a1a">Цикл испытания города и его таймеры (services/battles.ts)</text>

  <!-- timeline -->
  <line x1="40" y1="90" x2="680" y2="90" stroke="#6b645a" stroke-width="3"/>
  <circle cx="60" cy="90" r="6" fill="#c7742a"/>
  <text x="60" y="66" text-anchor="start" fill="#3b2a1a">старт вызова</text>
  <circle cx="330" cy="90" r="6" fill="#c7742a"/>
  <text x="330" y="66" text-anchor="middle" fill="#3b2a1a">капитан отправил: T зафиксировано</text>
  <circle cx="470" cy="90" r="6" fill="#2e627e"/>
  <text x="470" y="118" text-anchor="middle" fill="#3b2a1a">админ одобрил всё</text>
  <circle cx="660" cy="90" r="6" fill="#2e627e"/>
  <text x="660" y="66" text-anchor="end" fill="#3b2a1a">дедлайн ответа</text>
  <text x="195" y="118" text-anchor="middle" fill="#c7742a">T ≤ 14 дней (иначе сгорел)</text>
  <text x="600" y="142" text-anchor="middle" fill="#2e627e">ровно T от одобрения (≥ 60 с)</text>
  <text x="330" y="142" text-anchor="middle" fill="#6b645a">проверка в T не входит</text>

  <!-- stage 1 -->
  <rect x="16" y="160" width="688" height="96" rx="8" fill="#fff7f0" stroke="#c7742a" stroke-width="2"/>
  <text x="28" y="184" fill="#3b2a1a" font-weight="bold">1. Вызов (ATTACK)</text>
  <text x="28" y="206" fill="#6b645a">ставка N ≥ max(10 + штраф, уровень + 1); объявить может любой участник (код)</text>
  <text x="28" y="226" fill="#6b645a">отрывок случайный, min(N, стихов книги); участники отмечают стихи + ссылки</text>
  <text x="28" y="246" fill="#6b645a">капитан отправляет, когда сумма по участникам ≥ N; после этого стихи не добавить</text>

  <line x1="360" y1="256" x2="360" y2="280" stroke="#6b645a" stroke-width="2" marker-end="url(#a)"/>

  <!-- stage 2 -->
  <rect x="16" y="284" width="688" height="96" rx="8" fill="#ffffff" stroke="#6b645a" stroke-width="2"/>
  <text x="28" y="308" fill="#3b2a1a" font-weight="bold">2. Проверка админом (каждая запись: одобрить / вернуть)</text>
  <text x="28" y="330" fill="#6b645a">возврат после отправки и нехватка суммы → отправка снимается, T растёт</text>
  <text x="28" y="350" fill="#6b645a">все записи одобрены и одобренная сумма ≥ N → старт ответа</text>
  <text x="28" y="370" fill="#6b645a">хранителям письмо: число стихов и дедлайн (таймер уже идёт)</text>

  <line x1="360" y1="380" x2="360" y2="404" stroke="#6b645a" stroke-width="2" marker-end="url(#a)"/>

  <!-- stage 3 -->
  <rect x="16" y="408" width="688" height="96" rx="8" fill="#eef4f7" stroke="#2e627e" stroke-width="2"/>
  <text x="28" y="432" fill="#3b2a1a" font-weight="bold">3. Ответ (DEFENSE)</text>
  <text x="28" y="454" fill="#6b645a">капитан выбирает любой отрывок подряд из всей книги (пока нет отметок)</text>
  <text x="28" y="474" fill="#6b645a">участники отмечают стихи + ссылки; капитан отправляет до дедлайна</text>
  <text x="28" y="494" fill="#6b645a">нужно M ≥ одобренной суммы вызова; ничья — за хранителями</text>

  <!-- outcomes -->
  <line x1="120" y1="504" x2="120" y2="532" stroke="#6b645a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="504" x2="360" y2="532" stroke="#6b645a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="504" x2="600" y2="532" stroke="#6b645a" stroke-width="2" marker-end="url(#a)"/>

  <rect x="16" y="536" width="218" height="104" rx="8" fill="#ffffff" stroke="#c7742a" stroke-width="2"/>
  <text x="125" y="560" text-anchor="middle" fill="#3b2a1a" font-weight="bold">Вызов не завершён</text>
  <text x="125" y="584" text-anchor="middle" fill="#6b645a">14 дней без отправки</text>
  <text x="125" y="604" text-anchor="middle" fill="#6b645a">штраф +5 претендентам</text>
  <text x="125" y="624" text-anchor="middle" fill="#6b645a">хранителям письма нет</text>

  <rect x="251" y="536" width="218" height="104" rx="8" fill="#f3f7f1" stroke="#4c7a3f" stroke-width="2"/>
  <text x="360" y="560" text-anchor="middle" fill="#3b2a1a" font-weight="bold">Устоял (REPELLED)</text>
  <text x="360" y="584" text-anchor="middle" fill="#6b645a">всё одобрено, M ≥ нужно</text>
  <text x="360" y="604" text-anchor="middle" fill="#6b645a">уровень города = M</text>
  <text x="360" y="624" text-anchor="middle" fill="#6b645a">суммарный → навсегда</text>

  <rect x="486" y="536" width="218" height="104" rx="8" fill="#fff7f0" stroke="#c7742a" stroke-width="2"/>
  <text x="595" y="560" text-anchor="middle" fill="#3b2a1a" font-weight="bold">Перешёл (WON)</text>
  <text x="595" y="584" text-anchor="middle" fill="#6b645a">дедлайн без отправки,</text>
  <text x="595" y="604" text-anchor="middle" fill="#6b645a">уступка или возврат</text>
  <text x="595" y="624" text-anchor="middle" fill="#6b645a">уровень = max(N, сумма)</text>

  <!-- queue and sweep -->
  <text x="16" y="672" fill="#3b2a1a" font-weight="bold">Очередь:</text>
  <text x="96" y="672" fill="#6b645a">один вызов на город; следующий — с большей ставкой (при равной — ранний);</text>
  <text x="16" y="694" fill="#6b645a">ставка ниже нового минимума → отмена с письмом; в очереди ставку можно поднять.</text>
  <text x="16" y="724" fill="#3b2a1a" font-weight="bold">Сроки:</text>
  <text x="80" y="724" fill="#6b645a">sweep каждые 60 с и перед чтением; там же срок игры и проходы (3 дня);</text>
  <text x="16" y="746" fill="#6b645a">потеря столицы → команда выбыла, города в руины, её испытания отменены.</text>
</svg>
