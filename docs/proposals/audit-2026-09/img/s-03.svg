<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b2a1a"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b2a1a">Цикл испытания города и точки эксплуатации (Э1–Э6)</text>

  <!-- верхний ряд -->
  <rect x="20" y="60" width="150" height="70" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="95" y="82" text-anchor="middle" fill="#3b2a1a" font-weight="bold">1. Изучить город</text>
  <text x="95" y="100" text-anchor="middle" fill="#6b645a" font-size="13">все районы решены,</text>
  <text x="95" y="116" text-anchor="middle" fill="#6b645a" font-size="13">виден уровень L</text>

  <rect x="200" y="60" width="150" height="70" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="275" y="82" text-anchor="middle" fill="#3b2a1a" font-weight="bold">2. Объявить: N</text>
  <text x="275" y="100" text-anchor="middle" fill="#6b645a" font-size="13">N ≥ max(10+штраф, L+1)</text>
  <text x="275" y="116" text-anchor="middle" fill="#6b645a" font-size="13">битва идёт — в очередь</text>

  <rect x="380" y="60" width="150" height="70" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="455" y="82" text-anchor="middle" fill="#3b2a1a" font-weight="bold">3. Жребий отрывка</text>
  <text x="455" y="100" text-anchor="middle" fill="#6b645a" font-size="13">длина min(N, стихов книги)</text>
  <text x="455" y="116" text-anchor="middle" fill="#6b645a" font-size="13">N ≥ книги → вся книга</text>

  <rect x="560" y="60" width="140" height="70" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="630" y="82" text-anchor="middle" fill="#3b2a1a" font-weight="bold">4. Атака ≤ 14 дн.</text>
  <text x="630" y="100" text-anchor="middle" fill="#6b645a" font-size="13">сумма по людям ≥ N</text>
  <text x="630" y="116" text-anchor="middle" fill="#6b645a" font-size="13">T = до отправки</text>

  <line x1="170" y1="95" x2="198" y2="95" stroke="#3b2a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="95" x2="378" y2="95" stroke="#3b2a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="95" x2="558" y2="95" stroke="#3b2a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- переход вниз -->
  <path d="M630,130 L630,160 L95,160 L95,188" fill="none" stroke="#3b2a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- нижний ряд -->
  <rect x="20" y="190" width="150" height="70" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="95" y="212" text-anchor="middle" fill="#3b2a1a" font-weight="bold">5. Проверка админа</text>
  <text x="95" y="230" text-anchor="middle" fill="#6b645a" font-size="13">одобрена последняя</text>
  <text x="95" y="246" text-anchor="middle" fill="#6b645a" font-size="13">запись → старт обороны</text>

  <rect x="200" y="190" width="150" height="70" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="275" y="212" text-anchor="middle" fill="#3b2a1a" font-weight="bold">6. Оборона ровно T</text>
  <text x="275" y="230" text-anchor="middle" fill="#6b645a" font-size="13">свой отрывок, сумма M</text>
  <text x="275" y="246" text-anchor="middle" fill="#6b645a" font-size="13">M ≥ сумма атаки</text>

  <rect x="380" y="190" width="320" height="70" rx="6" fill="#ffffff" stroke="#2e627e" stroke-width="2"/>
  <text x="540" y="212" text-anchor="middle" fill="#3b2a1a" font-weight="bold">7. Итог</text>
  <text x="540" y="230" text-anchor="middle" fill="#6b645a" font-size="13">не успели / сдались → город переходит, L = сумма атаки</text>
  <text x="540" y="246" text-anchor="middle" fill="#6b645a" font-size="13">отражено → L = M; в суммарном режиме → закреплён навсегда</text>

  <line x1="170" y1="225" x2="198" y2="225" stroke="#3b2a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="225" x2="378" y2="225" stroke="#3b2a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- возврат к 2 -->
  <path d="M540,260 L540,285 L275,285 L275,262" fill="none" stroke="#6b645a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="408" y="300" text-anchor="middle" fill="#6b645a" font-size="13">следующая атака ≥ L + 1</text>

  <!-- маркеры эксплуатации -->
  <g font-size="13" font-weight="bold" fill="#ffffff">
    <circle cx="340" cy="60" r="12" fill="#c7742a"/><text x="340" y="65" text-anchor="middle">Э1</text>
    <circle cx="520" cy="60" r="12" fill="#c7742a"/><text x="520" y="65" text-anchor="middle">Э2</text>
    <circle cx="690" cy="60" r="12" fill="#c7742a"/><text x="690" y="65" text-anchor="middle">Э3</text>
    <circle cx="160" cy="190" r="12" fill="#c7742a"/><text x="160" y="195" text-anchor="middle">Э4</text>
    <circle cx="340" cy="190" r="12" fill="#c7742a"/><text x="340" y="195" text-anchor="middle">Э5</text>
    <circle cx="690" cy="190" r="12" fill="#c7742a"/><text x="690" y="195" text-anchor="middle">Э6</text>
  </g>

  <!-- расшифровка -->
  <rect x="20" y="318" width="680" height="150" rx="8" fill="#ffffff" stroke="#3b2a1a" stroke-width="1.5"/>
  <g fill="#3b2a1a" font-size="13">
    <text x="34" y="340"><tspan font-weight="bold" fill="#c7742a">Э1</tspan> Бронь очереди: ставка 100 000 ставит команду первой; сгорание стоит всего +5 к минимуму.</text>
    <text x="34" y="361"><tspan font-weight="bold" fill="#c7742a">Э2</tspan> Ставка ≥ стихов книги → отрывок предсказуем (вся книга): выучить заранее, отправить за час.</text>
    <text x="34" y="382"><tspan font-weight="bold" fill="#c7742a">Э3</tspan> Ставка — пол, не потолок: 8 человек × 10 стихов одного отрывка = 80; T можно сжать до часов.</text>
    <text x="34" y="403"><tspan font-weight="bold" fill="#c7742a">Э4</tspan> Часы защитников идут с момента одобрения админом: ночь, будни, сессия — как повезёт.</text>
    <text x="34" y="424"><tspan font-weight="bold" fill="#c7742a">Э5</tspan> Защитники выбирают самый лёгкий отрывок, ничья их: против живой команды атака почти безнадёжна.</text>
    <text x="34" y="445"><tspan font-weight="bold" fill="#c7742a">Э6</tspan> Закрепление навсегда + разовый перенос столицы на закреплённый город = бессмертная команда.</text>
  </g>
</svg>
