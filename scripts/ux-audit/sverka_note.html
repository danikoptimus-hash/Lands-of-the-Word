<p class="note small">Макеты пять раз смотрел независимый проверяющий, не видевший работы, — каждый раз новый. В первых трёх кругах он находил серьёзные недостатки — четыре, один и один; все исправлены. В четвёртом и пятом серьёзных не нашёл. Оставшиеся средние и мелкие замечания — в материалах проверки в репозитории.</p>
